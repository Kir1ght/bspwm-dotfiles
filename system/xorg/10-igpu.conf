# Keep the NVIDIA dGPU out of the X server: the internal panel is driven by
# the AMD iGPU, and loading the NVIDIA driver there costs battery because the
# dGPU can no longer runtime-suspend.
#
# This is the state `hdmi-gpu off` installs. `hdmi-gpu on` renames it to
# 10-igpu.conf.disabled so the NVIDIA driver may be autoloaded again (HDMI
# lives on the NVIDIA card, so presenting needs it).
#
# AutoAddGPU false keeps the X server from attaching the NVIDIA device as an
# extra screen on its own; amdgpu still matches through the OutputClass below,
# which pins the internal panel to the iGPU.
Section "OutputClass"
    Identifier "igpu only"
    MatchDriver "amdgpu"
    Driver "modesetting"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
