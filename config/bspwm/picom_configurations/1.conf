# vim: foldmethod=marker

backend = "glx";
vsync = true;
use-damage = true;
unredir-if-possible = true;
# Не выдёргивать Pear Desktop (YouTube Music) из композитинга: иначе
# Chromium теряет damage-события и перестаёт перерисовывать интерфейс
# (панель плеера пропадает до переключения полноэкранного режима).
unredir-if-possible-exclude = [
  "class_g = 'com.github.th-ch.youtube-music'",
];
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;

# Fading {{{
fading = true;
fade-in-step = 0.09;
fade-out-step = 0.08;
fade-delta = 10;
no-fading-openclose = false;
fade-exclude = [
  "class_g *?= 'Swappy'",
  "class_g *?= 'swappy'",
  "class_g *?= 'slop'",
];
# }}}

# Wintypes {{{
wintypes:
{
  tooltip = { shadow = false; };
};
# }}}

# Shadows {{{
shadow = true;
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.75;

shadow-exclude = [
  "bounding_shaped && !rounded_corners",
  "window_type = 'desktop'",
  "window_type = 'utility'",
  "window_type = 'splash'",
  "window_type = 'tooltip'",
  "window_type *= 'menu'",
  "window_type != 'dock' && BSPWM_TILED = 1",
  "class_g *?= 'activate-linux'",
  "class_g *?= 'Swappy'",
  "class_g *?= 'slop'",
];
# }}}

# Blur {{{
blur:
{
  method = "dual_kawase";
  strength = 3;
};

blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;

blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type *= 'menu'",
  "window_type = 'utility'",
  "window_type = 'tooltip'",
  "window_type = 'splash'",
  "class_g *?= 'screenkey'",
  "class_g *?= 'rofi'",
  "class_g *?= 'Swappy'",
  "class_g *?= 'swappy'",
  "class_g *?= 'maim'",
  "class_g *?= 'slop'",
  "class_g *?= 'flameshot'",
  "class_g *?= 'ksnip'",
  "class_g *?= 'GLava'",
  "class_g *?= 'kdeconnectd'",
  "class_g *?= 'kdeconnect.daemon'",
  "class_g *?= 'activate-linux'",
  "class_g *?= 'robloxstudiobeta.exe'",
  "class_g *?= 'vinegar'",
  "_GTK_FRAME_EXTENTS@"
];
# }}}

# Opacity {{{
frame-opacity = 0.94;

# inactive-dim = 0.8;

opacity-rule = [
  "95:class_g *?= 'chatterino'",
  "95:class_g *?= 'dunst'",
  "100:class_g *?= 'Swappy'",
  "100:class_g *?= 'slop'",
  "100:class_g *?= 'robloxstudiobeta.exe'",
  "100:class_g *?= 'vinegar'"
];
# }}}

# Rounded corners {{{
corner-radius = 10.0;

rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'utility'",
  "window_type = 'tooltip'",
  "window_type = 'splash'",
  "class_g *?= 'dunst'",
  "BSPWM_TILED = 1",
  "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'",
];
# }}}

# Animations {{{
# Short, Niri-like motion: tiles glide into place when the layout changes,
# and windows appear/disappear with a quick scale. Comment the whole block
# out if it ever feels distracting or heavy.
animations = ({
  triggers = [ "open", "show" ];
  preset = "appear";
  scale = 0.95;
  duration = 0.15;
}, {
  triggers = [ "close", "hide" ];
  preset = "disappear";
  scale = 0.95;
  duration = 0.12;
}, {
  triggers = [ "geometry" ];
  preset = "geometry-change";
  duration = 0.16;
});
# }}}
