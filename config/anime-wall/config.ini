# anime-wall settings. Keep this file private: it may contain API keys.
[general]
# Each booru gets its own subfolder: <download_dir>/<Provider>/.
download_dir = ~/Pictures/kiri-vault
default_provider = yandere
per_page = 24
rating = safe
min_score = 0
min_width = 1920
min_height = 1080
orientation = any
sort = score
# What Enter does in the result grid: apply (set as wallpaper) or save.
on_enter = save
preview_workers = 16

# Gelbooru wants an account API key and user id.
# https://gelbooru.com/index.php?page=account&s=options
[gelbooru]
api_key =
user_id =

# Only needed for gold-only Danbooru content.
[danbooru]
login =
api_key =