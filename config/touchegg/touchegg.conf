<touchégg>

  <settings>
    <property name="animation_delay">120</property>
    <property name="action_execute_threshold">15</property>
    <property name="color">auto</property>
    <property name="borderColor">auto</property>
  </settings>

  <!--
    bspwm gestures. The Touchégg client runs inside the X session and
    executes these commands as the logged-in user, so bspc works normally.

    Directions are "natural": swipe left goes to the next desktop, swipe
    right goes back to the previous one.
  -->
  <application name="All">

    <!-- 3 fingers left/right: switch desktops -->
    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>bspc desktop -f next.local</command>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>bspc desktop -f prev.local</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 3 fingers up/down: focus the window above/below -->
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>bspc node -f north</command>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>bspc node -f south</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 4 fingers left/right: move the window to the next/previous desktop -->
    <gesture type="SWIPE" fingers="4" direction="LEFT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>bspc node -d next.local --follow</command>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="RIGHT">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>bspc node -d prev.local --follow</command>
        <on>end</on>
      </action>
    </gesture>

    <!-- 4 fingers up/down: fullscreen / floating. bspwm's ~STATE toggle
         restores lastState, which bounces between floating and fullscreen
         after a visit to the other state, so use the explicit helper. -->
    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>$HOME/.local/bin/bspwm-toggle-state fullscreen</command>
        <on>end</on>
      </action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="RUN_COMMAND">
        <repeat>false</repeat>
        <command>$HOME/.local/bin/bspwm-toggle-state floating</command>
        <on>end</on>
      </action>
    </gesture>

  </application>
</touchégg>
