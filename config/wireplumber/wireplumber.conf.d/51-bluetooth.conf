# LDAC on this MediaTek MT7922 combo card only sustains about 330 kbps:
# 660 ("sq") and adaptive "auto" both break up even after disabling Wi-Fi
# power save and USB autosuspend. The codec quality is a device property, so
# it must be set through a monitor rule — monitor.bluez.properties does not
# reach the codec.
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality = "mq"
      }
    }
  }
]
