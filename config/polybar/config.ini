;==========================================================
;  Polybar — palette generated from the wallpaper
;  Monitor/battery/backlight/wifi autodetected in launch.sh
;==========================================================

[global/wm]
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules.ini

; --- Main laptop monitor -----------------------------------

[bar/top]
monitor = ${env:MONITOR:eDP-1}
width = 98%
height = 36
padding-left = 1
padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = 4
wm-restack = bspwm
enable-ipc = true

modules-left = filesystem space bspwm space cpu space memory space temperature space gpu
modules-center = player
modules-right = weather space tray space caffeine space powerprofile space backlight space battery space pulseaudio space xkeyboard space time space wlan space powermenu

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=18;5
font-2 = Noto Sans CJK SC:size=13;4

; --- External monitor (kept compact) -----------------------

[bar/top_external]
monitor = ${env:MONITOR_EXTERNAL:HDMI-1-1}
width = 98%
height = 26
padding-left = 1
padding-right = 0
background = ${colors.background}
foreground = ${colors.foreground}
bottom = false
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}
offset-x = 1%
offset-y = 0.5%
fixed-center = true
line-size = 3
wm-restack = bspwm
enable-ipc = true

modules-left = filesystem space bspwm space cpu space memory space temperature space gpu
modules-center = player
modules-right = weather space caffeine space powerprofile space backlight space battery space pulseaudio space xkeyboard space time space wlan space powermenu

font-0 = JetBrainsMono Nerd Font:style=Bold:pixelsize=13;3
font-1 = JetBrainsMono Nerd Font:size=18;5
font-2 = Noto Sans CJK SC:size=13;4