;==========================================================
;  Polybar modules — Dracula
;==========================================================

[module/space]
type = custom/text
format = " "

; --- System -------------------------------------------------

[module/filesystem]
type = custom/text
format = " "
format-padding = 1
click-left = rofi -show drun
format-foreground = ${colors.foreground}

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
inline-mode = true
enable-click = true
enable-scroll = true
reverse-scroll = false

format = <label-state>
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9

label-separator = ""
label-separator-background = ${colors.background}

label-focused =  %icon%
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-focused-background = ${colors.background}

label-occupied = %icon%
label-occupied-foreground = ${colors.foreground}
label-occupied-background = ${colors.background}
label-occupied-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.fg-dim}
label-empty-padding = 1
label-empty-background = ${colors.background}

label-urgent = %icon%
label-urgent-foreground = ${colors.red}
label-urgent-background = ${colors.bg-light}
label-urgent-padding = 1

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 70

format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-padding = 1
label = %temperature-c%
label-warn = %temperature-c%
ramp-0 = ""
ramp-foreground = ${colors.fg-dim}
label-foreground = ${colors.foreground}
label-warn-foreground = ${colors.red}

[module/memory]
type = internal/memory
interval = 2
format = <label>
format-prefix = " "
format-prefix-foreground = ${colors.fg-dim}
format-padding = 1
format-foreground = ${colors.foreground}
label = %gb_used%
label-foreground = ${colors.foreground}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.fg-dim}
format = <label>
label = %percentage%%
format-foreground = ${colors.foreground}
label-foreground = ${colors.foreground}

[module/gpu]
type = custom/script
exec = ~/bin/polybar-gpu
interval = 5
click-left = alacritty --hold -e nvidia-smi
format-padding = 1
format-foreground = ${colors.foreground}

[module/updates]
type = custom/script
exec = ~/bin/polybar-updates
interval = 3600
click-left = ~/bin/system-update
format-padding = 1
format-foreground = ${colors.orange}

[module/player]
type = custom/script
exec = ~/bin/polybar-player
; 1s upper bound: playerctl is wrapped in `timeout` by the script, so a
; vanished player can never freeze the label for longer than one tick.
interval = 1
click-left = playerctl play-pause 2>/dev/null || mpc toggle
click-right = playerctl next 2>/dev/null || mpc next
scroll-up = playerctl previous 2>/dev/null || mpc prev
scroll-down = playerctl next 2>/dev/null || mpc next
format-padding = 1
format-foreground = ${colors.accent}

[module/weather]
type = custom/script
exec = ~/bin/weather
interval = 1800
click-left = ~/bin/weather-show
format-padding = 1
format-foreground = ${colors.fg-dim}

; --- Audio / hardware --------------------------------------

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
format-foreground = ${colors.foreground}
format-muted = 󰖁
format-muted-padding = 1

label-volume = %percentage%%

ramp-volume-0 = 󰖀
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰖀
ramp-volume-3 = 󰖀
ramp-volume-4 = 󰖀
ramp-volume-5 = 󰕾
ramp-volume-6 = 󰕾
ramp-volume-7 = 󰕾
ramp-volume-8 = 󰕾

click-right = pavucontrol

[module/backlight]
type = custom/script
; One long-lived process: no fork every second, and the label follows any
; brightness change (Polybar click, hardware key) almost immediately.
exec = ~/bin/brightness-watch
tail = true
click-left = ~/bin/brightness --up
click-right = ~/bin/brightness --down
scroll-up = ~/bin/brightness --up
scroll-down = ~/bin/brightness --down
format = <label>
format-prefix = "  "
format-prefix-foreground = ${colors.fg-dim}
format-padding = 1
label = %output%
label-foreground = ${colors.foreground}

[module/battery]
type = internal/battery
full-at = 98
low-at = 10

battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC0}
poll-interval = 5

time-format = %H:%M
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <label-low> <animation-low>

label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = " 100% "
label-low = "%percentage% "

ramp-capacity-0 = " "
ramp-capacity-1 = " "
ramp-capacity-2 = " "
ramp-capacity-3 = " "
ramp-capacity-4 = " "
bar-capacity-width = 10

animation-charging-0 = " "
animation-charging-1 = " "
animation-charging-2 = " "
animation-charging-3 = " "
animation-charging-4 = " "
animation-charging-framerate = 910

animation-discharging-0 = " "
animation-discharging-1 = " "
animation-discharging-2 = " "
animation-discharging-3 = " "
animation-discharging-4 = " "
animation-discharging-framerate = 500

animation-low-0 = "  "
animation-low-1 = "  "
animation-low-framerate = 1500

animation-low-foreground = ${colors.red}
label-charging-foreground = ${colors.foreground}
label-discharging-foreground = ${colors.foreground}
label-full-foreground = ${colors.foreground}
ramp-capacity-foreground = ${colors.foreground}
animation-charging-foreground = ${colors.foreground}
format-charging-foreground = ${colors.foreground}

; --- Session / status --------------------------------------

[module/wlan]
type = internal/network
interface = ${env:WLAN_IFACE:wlan0}
interval = 3.0
format-connected =  <label-connected>
label-connected = "%{A1:sh $HOME/bin/wifimenu:} %{A}"
label-connected-foreground = ${colors.foreground}
format-disconnected = <label-disconnected>
label-disconnected = "%{A1:sh $HOME/bin/wifimenu:}󰖪 %{A}"
label-disconnected-foreground = ${colors.red}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
format = <label-layout> <label-indicator>
label-layout-padding = 1
label-layout-foreground = ${colors.fg-dim}
label-indicator-on = %name%
label-indicator-on-capslock = !
label-indicator-off-capslock =

[module/time]
type = custom/script
; One long-lived process that prints on every new second, instead of
; forking `date` once per second. Lower CPU wakeups on battery and the
; label keeps ticking even when the bar is busy.
exec = while :; do date '+%H:%M'; sleep 1; done
tail = true
format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-prefix = "  "
format-padding = 1
label = %output%
click-left = alacritty -e calcurse

[module/caffeine]
type = custom/script
exec = ~/bin/caffeine.sh
interval = 2
click-left = ~/bin/caffeine.sh --toggle
format-padding = 1
format-background = ${colors.background}

[module/powerprofile]
type = custom/script
exec = ~/bin/power-profile
interval = 2
click-left = ~/bin/power-profile --toggle
format = <label>
label = %output%
format-padding = 1

[module/tray]
type = internal/tray
tray-size = 16px
tray-spacing = 4px
format-margin = 8px

[module/powermenu]
type = custom/text
format = " "
format-padding = 1
click-left = sh $HOME/bin/powermenu &
format-foreground = ${colors.fg-dim}

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...
